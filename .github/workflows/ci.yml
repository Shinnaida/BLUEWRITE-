name: CI

# Addresses Risk #5 (System Application / Software Attack) gap:
# "No CI pipeline running tests + audit on push."
#
# Backend: clean install + full test suite + production dependency audit
#          (fails on High/Critical findings).
# Frontend: production build as the gate + production dependency audit.
#          No test runner is configured yet (see docs/security/testing-gaps.md);
#          when one is added, replace the build step with build + test.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend — test & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # authSecurity.test.js exercises real login/lockout/ownership flows against
    # MySQL; this container gives CI the same engine as the dev setup (8.4).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bluewrite_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: bluewrite_db
      SESSION_SECRET: ci-only-session-secret-not-real

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"; exit 1

      - name: Load schema and seed data
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot bluewrite_db < database/seed.sql

      - name: Run tests
        run: npm test

      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend — build & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Build (gate until a test runner exists)
        run: npm run build

      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
